name: ci

# A push or pull request that changes only specs or markdown outside the
# exceptions starts no run, because no build or test reads them. The exceptions
# are CHANGELOG.md, whose newest release the version test reads, and the
# markdown inside a testdata directory, which tests load.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!specs/**"
      - "!**.md"
      - "CHANGELOG.md"
      - "**/testdata/**"
  pull_request:
    paths:
      - "**"
      - "!specs/**"
      - "!**.md"
      - "CHANGELOG.md"
      - "**/testdata/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The shared gate. Its tool is pinned in internal/gate, a module of its own,
  # so the SDK's go.mod stays free of requirements.
  gate:
    uses: latere-ai/ci/.github/workflows/lateregate.yml@v1
    with:
      gate_module: internal/gate

  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          # The module has no dependencies, so there is nothing to cache.
          cache: false
      - name: Test
        # bash on every runner: PowerShell splits -coverprofile=coverage.out
        # at the dot.
        shell: bash
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.x'
        shell: bash
        run: |
          go tool cover -func=coverage.out | tail -1
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  # What the gate does not cover: the browser build, the standard-library-only
  # promise at the module level, and the refresh tool, a module of its own.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: tools/go.sum
      - name: WebAssembly
        run: make wasm
      - name: The module has no dependencies
        run: |
          if grep -q '^require' go.mod || [ -e go.sum ]; then
            echo "go.mod requires a module; the SDK depends on the standard library alone" >&2
            exit 1
          fi
      - name: The refresh tool builds
        working-directory: tools
        run: go vet ./...
