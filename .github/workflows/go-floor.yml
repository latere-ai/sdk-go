name: go-floor

# What the shared gate cannot express: the Go release the module declares as
# its floor, the browser build, and the Windows test. The gate runs the suite
# on the toolchain its own module pins, one Go version, so the oldest
# supported release and the WebAssembly vet run here. The shared workflow's
# test job runs its steps in the runner's default shell, which on Windows is
# PowerShell and cannot read them, so the Windows test runs here with bash.
#
# A push or pull request that changes only specs or markdown outside the
# exceptions starts no run, because no build or test reads them. The exceptions
# are CHANGELOG.md, whose newest release the version test reads, and the
# markdown inside a testdata directory, which tests load.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!specs/**"
      - "!**.md"
      - "CHANGELOG.md"
      - "**/testdata/**"
  pull_request:
    paths:
      - "**"
      - "!specs/**"
      - "!**.md"
      - "CHANGELOG.md"
      - "**/testdata/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: "1.26.x"
          - os: windows-latest
            go: "1.26.x"
          - os: windows-latest
            go: "1.27.x"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          # The module has no dependencies, so there is nothing to cache.
          cache: false
      - name: Test
        # bash on every runner, so the step reads the same on each.
        shell: bash
        run: go test -race -count=1 ./...

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: WebAssembly
        run: make wasm
