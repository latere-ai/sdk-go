name: go-floor

# What the shared gate cannot express: the Go release the module declares as
# its floor, and the browser build. The gate runs the suite on the toolchain
# its own module pins, one Go version, so the oldest supported release and
# the WebAssembly vet run here.
#
# A push or pull request that changes only specs or markdown outside the
# exceptions starts no run, because no build or test reads them. The exceptions
# are CHANGELOG.md, whose newest release the version test reads, and the
# markdown inside a testdata directory, which tests load.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!specs/**"
      - "!**.md"
      - "CHANGELOG.md"
      - "**/testdata/**"
  pull_request:
    paths:
      - "**"
      - "!specs/**"
      - "!**.md"
      - "CHANGELOG.md"
      - "**/testdata/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  floor:
    name: test (Go 1.26.x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          # The module has no dependencies, so there is nothing to cache.
          cache: false
      - name: Test
        run: go test -race -count=1 ./...

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: WebAssembly
        run: make wasm
