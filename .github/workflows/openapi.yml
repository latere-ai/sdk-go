name: API documents

# Once a week, fetch the API's OpenAPI documents and fail when they differ
# from the vendored copies, so a maintainer refreshes them with
# `make openapi` and lets the tests show which models to change.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: tools/go.sum
      - run: make openapi
      - name: The vendored documents are current
        run: git diff --exit-code -- openapi/
