name: API documents

# Once a week, fetch the API's OpenAPI documents and fail when they differ
# from the vendored copies, so a maintainer refreshes them with
# `make openapi` and lets the tests show which models to change.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: make openapi
      - name: The vendored documents are current
        run: git diff --exit-code -- openapi/
